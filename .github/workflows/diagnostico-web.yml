name: Diagnostico Web - pruebas antes del deploy

on:
  push:
    paths:
      - 'herramientas/diagnostico_web.py'
      - 'templates/diagnostico_web.html'
      - 'tests/test_diagnostico_publico.py'
      - 'app.py'
      - 'requirements.txt'
      - '.github/workflows/diagnostico-web.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py herramientas/diagnostico_web.py
      - run: python -m unittest discover -s tests -p 'test_diagnostico_publico.py' -v
