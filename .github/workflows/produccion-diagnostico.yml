name: Verificar diagnostico-web en produccion

on:
  push:
    paths:
      - 'herramientas/diagnostico_web.py'
      - 'templates/diagnostico_web.html'
      - 'app.py'
      - 'requirements.txt'
      - '.github/workflows/produccion-diagnostico.yml'
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Comprobar que el deploy responde con la nueva pantalla
        shell: bash
        run: |
          set -euo pipefail
          url="https://converte.uno/diagnostico-web/"
          for i in $(seq 1 18); do
            code=$(curl -L --silent --show-error --max-time 18 -o /tmp/diagnostico.html -w '%{http_code}' "$url" || true)
            if [ "$code" = "200" ] && grep -Fq 'Escribe la página que quieres revisar' /tmp/diagnostico.html; then
              echo "OK: Diagnostico Web publico y version nueva"
              break
            fi
            echo "Intento $i: HTTP $code. Esperando el deploy..."
            if [ "$i" -eq 18 ]; then
              echo "::error::El servicio aun no entrega la nueva ruta. Revisar Render y rama desplegada."
              exit 1
            fi
            sleep 15
          done
          curl --silent --show-error --fail --max-time 20 https://converte.uno/health | grep -Fq 'OK'
          curl --silent --show-error --fail --max-time 20 https://converte.uno/sitemap.xml | grep -Fq 'https://converte.uno/diagnostico-web/'
          echo 'OK: health, ruta publica y sitemap'
          echo 'Verificando revision actual y proteccion de informe...'
          for n in $(seq 1 22); do
            code=$(curl -sSL --max-time 20 -D /tmp/revision.headers -o /dev/null -w '%{http_code}' https://converte.uno/diagnostico-web/ || true)
            if [ "$code" = "200" ] && grep -Fiq 'X-Diagnostico-Revision: 2026-10-28-pdf-pago-v1' /tmp/revision.headers; then
              break
            fi
            if [ "$n" -eq 22 ]; then
              echo "::error::Render no confirmo la revision con informe PDF."
              exit 1
            fi
            sleep 10
          done
          code=$(curl -sSL --max-time 15 -o /dev/null -w '%{http_code}' https://converte.uno/diagnostico-web/descargar || true)
          test "$code" = "404" || { echo "::error::PDF sin pago no esta protegido"; exit 1; }
          echo 'OK: revision actual confirmada, y PDF sin pago protegido (404)'
          if grep -Fiq 'X-Diagnostico-Checkout: enabled' /tmp/revision.headers; then
            echo 'CHECKOUT_READY=true'
          else
            echo 'CHECKOUT_READY=false'
          fi
      - name: Verificar CTA comercial del informe en produccion
        shell: bash
        run: |
          set -euo pipefail
          url="https://converte.uno/diagnostico-web/"
          for i in $(seq 1 18); do
            code=$(curl -LsS --max-time 40 -D /tmp/reporte-cta.headers -o /tmp/reporte-cta.html -w '%{http_code}' \
              --data-urlencode 'url=https://example.com/' \
              --data-urlencode 'objetivo=ventas' "$url" || true)
            if [ "$code" = "200" ] && \
               grep -Fq 'Comprar informe y recibir PDF' /tmp/reporte-cta.html && \
               grep -Fq 'id="planes"' /tmp/reporte-cta.html && \
               grep -Fq 'Comprueba tus avances' /tmp/reporte-cta.html && \
               grep -Fq 'class="tier popular tier-clickable"' /tmp/reporte-cta.html && \
               grep -Fq 'formaction="/diagnostico-web/comprar"' /tmp/reporte-cta.html && \
               grep -Fq 'formaction="/diagnostico-web/suscribir"' /tmp/reporte-cta.html && \
               grep -Fq '<svg viewBox="0 0 24 24"' /tmp/reporte-cta.html && \
               grep -Fq 'data-plan="unico"' /tmp/reporte-cta.html && \
               grep -Fq 'data-plan="mensual"' /tmp/reporte-cta.html && \
               grep -Fq 'Ver los 14 aspectos que incluye el informe' /tmp/reporte-cta.html && \
               grep -Fq 'Ver qué revisamos cada mes y cómo funciona' /tmp/reporte-cta.html && \
               grep -Fq '@media(max-width:470px)' /tmp/reporte-cta.html; then
              echo "OK: tres tarjetas con detalles propios, 14 aspectos por plan, CTA nativo y CSS móvil"
              exit 0
            fi
            echo "Intento $i: HTTP $code, esperando la version con CTA..."
            sleep 12
          done
          echo "::error::La version publicada no muestra el nuevo CTA."
          exit 1
      - name: Validar ambas compras y paso real al dominio de Stripe sin pagar
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in comprar suscribir; do
            result=$(curl -sS --max-time 55 -D /tmp/pago.headers -o /tmp/pago.html -w '%{http_code}' \
              --data-urlencode 'url=https://example.com/' \
              --data-urlencode 'objetivo=ventas' \
              "https://converte.uno/diagnostico-web/$endpoint" || true)
            if [ "$result" != "200" ]; then
              echo "::error::La compra $endpoint devolvio HTTP $result"
              exit 1
            fi
            grep -Fq '<meta http-equiv="refresh"' /tmp/pago.html || {
              echo "::error::Falta navegación automática a Stripe para $endpoint"
              exit 1
            }
            grep -Fq 'href="https://checkout.stripe.com/' /tmp/pago.html || {
              echo "::error::Falta enlace Stripe de respaldo para $endpoint"
              exit 1
            }
            grep -Fq 'Continuar al pago seguro' /tmp/pago.html
            echo "OK: $endpoint creó una sesión y entregó navegación automática sin cobro"
          done
