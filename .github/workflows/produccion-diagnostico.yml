name: Verificar diagnostico-web en produccion

on:
  push:
    paths:
      - 'herramientas/diagnostico_web.py'
      - 'templates/diagnostico_web.html'
      - 'app.py'
      - 'requirements.txt'
      - '.github/workflows/produccion-diagnostico.yml'
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Comprobar que el deploy responde con la nueva pantalla
        shell: bash
        run: |
          set -euo pipefail
          url="https://converte.uno/diagnostico-web/"
          for i in $(seq 1 18); do
            code=$(curl -L --silent --show-error --max-time 18 -o /tmp/diagnostico.html -w '%{http_code}' "$url" || true)
            if [ "$code" = "200" ] && grep -Fq 'Analiza tu página gratis' /tmp/diagnostico.html; then
              echo "OK: Diagnostico Web publico y version nueva"
              break
            fi
            echo "Intento $i: HTTP $code. Esperando el deploy..."
            if [ "$i" -eq 18 ]; then
              echo "::error::El servicio aun no entrega la nueva ruta. Revisar Render y rama desplegada."
              exit 1
            fi
            sleep 15
          done
          curl --silent --show-error --fail --max-time 20 https://converte.uno/health | grep -Fq 'OK'
          curl --silent --show-error --fail --max-time 20 https://converte.uno/sitemap.xml | grep -Fq 'https://converte.uno/diagnostico-web/'
          echo 'OK: health, ruta publica y sitemap'
