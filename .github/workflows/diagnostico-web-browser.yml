name: Diagnostico Web - Chrome real, móvil y ambos Checkout

on:
  push:
    paths:
      - '.github/workflows/diagnostico-web-browser.yml'
      - 'herramientas/diagnostico_web.py'
      - 'herramientas/diagnostico_evaluacion.py'
      - 'herramientas/diagnostico_seguimiento.py'
      - 'templates/diagnostico_web.html'
      - 'templates/diagnostico_seguimiento.html'
  workflow_dispatch:

jobs:
  mobile-and-checkout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador de pruebas
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Abrir pagina en Chrome móvil y comprobar ambas tarjetas
        shell: bash
        run: |
          cat > /tmp/diagnostico-browser.cjs <<'NODE'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          (async () => {
            const browser = await chromium.launch({headless: true, args: ['--no-sandbox']});
            try {
              for (const [action, label] of [
                ['/diagnostico-web/comprar', 'informe $199'],
                ['/diagnostico-web/suscribir', 'seguimiento $349'],
              ]) {
                const page = await browser.newPage({
                  viewport: {width: 390, height: 844}, deviceScaleFactor: 1,
                  isMobile: true, hasTouch: true
                });
                await page.goto('https://converte.uno/diagnostico-web/', {
                  waitUntil:'domcontentloaded', timeout: 50000
                });
                const payCard = page.locator('button[form="audit-form"][formaction="' + action + '"]');
                // Wait for new production revision; do not test an old deployment.
                for(let wait=0;wait<22;wait++){
                  if(await payCard.count()) break;
                  await new Promise(done=>setTimeout(done,5000));
                  await page.reload({waitUntil:'domcontentloaded'});
                }
                await payCard.waitFor({timeout:25000});
                if(await page.locator('form#audit-form').count() !== 1) throw Error('No existe el formulario principal');
                await page.locator('input[name="url"]').fill('https://example.com/');
                await page.locator('select[name="objetivo"]').selectOption('ventas');
                await page.locator('.optional-fields summary').click();
                await page.locator('input[name="keyword"]').fill('Example');
                await page.locator('input[name="city"]').fill('Querétaro');
                if(await page.locator('button[formaction="/diagnostico-web/comprar"]').count() !== 1
                    || await page.locator('button[formaction="/diagnostico-web/suscribir"]').count() !== 1)
                  throw Error('Ambos botones de compra deben estar activos SIN análisis previo');
                if(!(await page.locator('details.checklist').textContent()).includes('Google Search Console'))
                  throw Error('No se muestran los temas revisados');
                const geometry = await page.evaluate(() => ({
                  width: document.documentElement.clientWidth,
                  scroll: document.documentElement.scrollWidth,
                  cards: document.querySelectorAll('.tiers > .tier').length,
                  icons: document.querySelectorAll('.tiers .tier-icon svg').length,
                  height: document.documentElement.scrollHeight,
                  sections: [...document.querySelectorAll('.hero,.formcard,#resultado,.tierscard,footer')].map(e=>({name:e.id||e.className,height:Math.round(e.getBoundingClientRect().height)})),
                  findings: document.querySelectorAll('.finding').length,
                }));
                if (geometry.scroll > geometry.width+2) throw Error('Desborde en movil: ' + JSON.stringify(geometry));
                if (geometry.cards !== 3 || geometry.icons !== 3) throw Error('Tarjetas/iconos incorrectos: ' + JSON.stringify(geometry));
                console.log('Geometría móvil:',JSON.stringify(geometry));
                if (geometry.height > 2600) throw Error('Página móvil demasiado larga: ' + JSON.stringify(geometry));
                // Clic intencionalmente en el NOMBRE de la tarjeta, no en un CTA interno.
                await payCard.locator('.tier-name').click();
                await page.waitForURL(url => url.hostname === 'checkout.stripe.com', {timeout:45000});
                console.log('OK ' + label + ': clic en cualquier parte del cuadro abre Stripe Checkout');
                await page.close();
              }
              const check = await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              await check.goto('https://converte.uno/diagnostico-web/',{waitUntil:'domcontentloaded'});
              await check.locator('input[name="url"]').fill('https://example.com/');
              await check.locator('button[type="submit"]:has-text("Analizar gratis")').click();
              await check.locator('#resultado').waitFor({timeout:30000});
              if(await check.locator('button[formaction="/diagnostico-web/comprar"]').count() !== 1)
                throw Error('La compra desapareció después del informe gratuito');
              console.log('OK diagnóstico gratuito y botones de pago visibles después');
              await check.close();
              const desktop = await browser.newPage({viewport:{width:1280,height:800}});
              await desktop.goto('https://converte.uno/diagnostico-web/', {waitUntil:'domcontentloaded'});
              const columns = await desktop.locator('.tiers').evaluate(el=>getComputedStyle(el).gridTemplateColumns.split(' ').length);
              if(columns!==3)throw Error('Diseño desktop no tiene 3 columnas: '+columns);
              console.log('OK desktop: tres planes en columnas');
              await desktop.close();
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
          node /tmp/diagnostico-browser.cjs
