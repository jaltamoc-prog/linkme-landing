<!--
  v1.066 - conserva el chat funcional validado y actualiza solo su acento visual a #00A982.
  LinkMe contigo - integración para la landing.
  Este bloque llama al endpoint seguro de la aplicación. No contiene la llave de OpenAI.
  Insertar antes de </body> en la landing vigente.
-->
<style>
  .lmc-landing-launch{position:fixed;right:18px;bottom:18px;z-index:99992;width:66px;height:66px;display:flex;align-items:center;justify-content:center;border:0;border-radius:50%;padding:0;background:#00a982;color:#fff;box-shadow:0 14px 38px rgba(0,169,130,.38);cursor:pointer;transition:transform .18s ease,box-shadow .18s ease}
  .lmc-landing-launch:hover{transform:translateY(-2px);box-shadow:0 18px 44px rgba(0,169,130,.45)}.lmc-landing-launch:focus-visible{outline:3px solid rgba(0,169,130,.28);outline-offset:4px}.lmc-landing-launch-icon{position:relative;width:29px;height:23px;border:3px solid #fff;border-radius:10px;box-sizing:border-box}.lmc-landing-launch-icon:after{content:"";position:absolute;right:3px;bottom:-7px;width:9px;height:9px;background:#00a982;border-right:3px solid #fff;border-bottom:3px solid #fff;transform:skewY(35deg)}.lmc-landing-launch-dot{position:absolute;right:1px;top:1px;width:13px;height:13px;border:3px solid #fff;border-radius:50%;background:#ff3b5c;box-sizing:border-box}
  .lmc-landing-panel{position:fixed;right:14px;bottom:96px;z-index:99991;width:min(390px,calc(100vw - 28px));height:min(610px,calc(100vh - 125px));display:none;flex-direction:column;overflow:hidden;background:#fff;border:1px solid #dde3f7;border-radius:24px;box-shadow:0 24px 70px rgba(16,24,40,.24);font-family:Arial,sans-serif}
  .lmc-landing-panel.open{display:flex}.lmc-landing-head{display:flex;flex:0 0 auto;align-items:center;justify-content:space-between;padding:12px 14px;background:#00a982;color:#fff}.lmc-landing-title{font-size:16px;font-weight:900}.lmc-landing-head-actions{display:flex;gap:8px}.lmc-landing-head-button{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border:0;border-radius:50%;font-size:20px;line-height:1;font-weight:900;cursor:pointer}.lmc-landing-minimize{background:#ffd84d;color:#493b00}.lmc-landing-close{background:#ff5b61;color:#fff}
  .lmc-landing-messages{flex:1;overflow:auto;padding:15px;background:#f7f8fc;display:flex;flex-direction:column;gap:10px}.lmc-landing-message{max-width:88%;padding:11px 13px;border-radius:16px;font-size:14px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}.lmc-landing-assistant{align-self:flex-start;background:#fff;color:#111;border:1px solid #e4e7ec}.lmc-landing-user{align-self:flex-end;background:#00a982;color:#fff}.lmc-landing-thinking{color:#667085;font-style:italic}
  .lmc-landing-form{display:flex;flex:0 0 auto;gap:8px;padding:10px 12px;border-top:1px solid #e4e7ec;background:#fff}.lmc-landing-input{flex:1;min-width:0;border:1px solid #cdd5df;border-radius:14px;padding:11px 12px;font:14px Arial,sans-serif;outline:none}.lmc-landing-input:focus{border-color:#00a982;box-shadow:0 0 0 3px rgba(0,169,130,.10)}.lmc-landing-send{border:0;border-radius:14px;padding:0 15px;background:#00a982;color:#fff;font-weight:900;cursor:pointer}.lmc-landing-send:disabled{opacity:.55}.lmc-landing-finish{flex:0 0 auto;border:0;border-top:1px solid #eef0f5;background:#fff;color:#667085;padding:9px 12px 11px;font-size:12px;font-weight:800;text-decoration:underline;cursor:pointer}
  @media(max-width:520px){.lmc-landing-panel{right:12px;bottom:calc(88px + env(safe-area-inset-bottom));width:330px;max-width:calc(100vw - 32px);height:420px;max-height:calc(100dvh - 170px);border-radius:18px}.lmc-landing-messages{padding:11px;overscroll-behavior:contain}.lmc-landing-form{padding:9px}.lmc-landing-send{padding:0 12px}.lmc-landing-launch{right:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:58px;height:58px}}
</style>
<button id="lmcLandingLaunch" class="lmc-landing-launch" type="button" aria-label="Abrir LinkMe contigo" title="LinkMe contigo" aria-controls="lmcLandingPanel" aria-expanded="false"><span class="lmc-landing-launch-icon" aria-hidden="true"><span class="lmc-landing-launch-dot"></span></span></button>
<section id="lmcLandingPanel" class="lmc-landing-panel" aria-label="LinkMe contigo">
  <div class="lmc-landing-head"><div class="lmc-landing-title">LinkMe contigo</div><div class="lmc-landing-head-actions"><button id="lmcLandingMinimize" class="lmc-landing-head-button lmc-landing-minimize" type="button" aria-label="Minimizar chat">−</button><button id="lmcLandingClose" class="lmc-landing-head-button lmc-landing-close" type="button" aria-label="Terminar conversación">×</button></div></div>
  <div id="lmcLandingMessages" class="lmc-landing-messages" aria-live="polite"></div>
  <form id="lmcLandingForm" class="lmc-landing-form"><input id="lmcLandingInput" class="lmc-landing-input" maxlength="900" autocomplete="off" placeholder="Escribe tu pregunta" aria-label="Escribe tu pregunta"><button id="lmcLandingSend" class="lmc-landing-send" type="submit">Enviar</button></form>
  <button id="lmcLandingFinish" class="lmc-landing-finish" type="button">Terminar conversación</button>
</section>
<script>
(function(){
  const endpoint={{ chat_api_url|tojson }};
  const launch=document.getElementById("lmcLandingLaunch"),panel=document.getElementById("lmcLandingPanel"),minimize=document.getElementById("lmcLandingMinimize"),close=document.getElementById("lmcLandingClose"),finish=document.getElementById("lmcLandingFinish"),form=document.getElementById("lmcLandingForm"),input=document.getElementById("lmcLandingInput"),send=document.getElementById("lmcLandingSend"),messages=document.getElementById("lmcLandingMessages");
  const historyKey="linkme_contigo_history",transcriptKey="linkme_contigo_transcript",conversationKey="linkme_contigo_conversation_id";
  let history=readSession(historyKey,[]),transcript=readSession(transcriptKey,[]),busy=false,locked=false;
  function readSession(key,fallback){try{const value=JSON.parse(sessionStorage.getItem(key)||"null");return Array.isArray(value)?value:fallback}catch(error){return fallback}}
  function writeSession(key,value){try{sessionStorage.setItem(key,JSON.stringify(value))}catch(error){}}
  function randomId(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
  function clientId(){const key="linkme_contigo_client_id";let value=localStorage.getItem(key);if(!value){value=crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);localStorage.setItem(key,value)}return value}
  function conversationId(){let value=sessionStorage.getItem(conversationKey);if(!value){value=randomId();sessionStorage.setItem(conversationKey,value)}return value}
  function add(text,role,extra,persist=true){const node=document.createElement("div");node.className="lmc-landing-message "+(role==="user"?"lmc-landing-user":"lmc-landing-assistant")+(extra?" "+extra:"");node.textContent=text;messages.appendChild(node);messages.scrollTop=messages.scrollHeight;if(persist&&!extra){transcript.push({text,role});transcript=transcript.slice(-30);writeSession(transcriptKey,transcript)}return node}
  function completed(){return history.filter(item=>item.role==="user").length>=10}
  function setCompleted(value){locked=value;input.disabled=value;send.disabled=value;input.placeholder=value?"Conversación completada":"Escribe tu pregunta"}
  if(transcript.length){transcript.forEach(item=>add(item.text,item.role,"",false))}else{add("Hola, soy LinkMe contigo","assistant")}
  setCompleted(completed());
  function closePanel(){panel.classList.remove("open");launch.setAttribute("aria-expanded","false");launch.setAttribute("aria-label","Abrir LinkMe contigo")}
  function openPanel(){panel.classList.add("open");launch.setAttribute("aria-expanded","true");launch.setAttribute("aria-label","Cerrar LinkMe contigo");if(window.innerWidth>520)setTimeout(()=>input.focus(),80)}
  function finishConversation(){if(!window.confirm("¿Quieres terminar esta conversación? Se borrará el historial de este chat."))return;history=[];transcript=[];sessionStorage.removeItem(historyKey);sessionStorage.removeItem(transcriptKey);sessionStorage.removeItem(conversationKey);messages.textContent="";setCompleted(false);add("Hola, soy LinkMe contigo","assistant");closePanel()}
  launch.addEventListener("click",()=>{panel.classList.contains("open")?closePanel():openPanel()});
  minimize.addEventListener("click",closePanel);
  close.addEventListener("click",finishConversation);
  finish.addEventListener("click",finishConversation);
  document.addEventListener("keydown",event=>{if(event.key==="Escape"&&panel.classList.contains("open"))closePanel()});
  form.addEventListener("submit",async function(event){event.preventDefault();const text=input.value.trim();if(!text||busy||locked)return;busy=true;send.disabled=true;input.disabled=true;add(text,"user");input.value="";const waiting=add("Estoy revisándolo…","assistant","lmc-landing-thinking",false);try{const response=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({context:"landing",client_id:clientId(),conversation_id:conversationId(),message:text,history:history.slice(-10)})});const data=await response.json();waiting.remove();const reply=data.reply||data.error||"No pude responder en este momento. Intenta nuevamente.";add(reply,"assistant");history.push({role:"user",content:text},{role:"assistant",content:reply});history=history.slice(-20);writeSession(historyKey,history);if(data.limit||completed())setCompleted(true)}catch(error){waiting.remove();add("No pude responder en este momento. Intenta nuevamente.","assistant")}finally{busy=false;if(!locked){input.disabled=false;send.disabled=false}if(window.innerWidth>520&&!input.disabled)input.focus()}});
})();
</script>
