<!--
  LinkMe contigo - integración para la landing.
  Este bloque llama al endpoint seguro de la aplicación. No contiene la llave de OpenAI.
  Insertar antes de </body> en la landing vigente.
-->
<style>
  .lmc-landing-launch{position:fixed;right:18px;bottom:18px;z-index:99990;border:0;border-radius:999px;padding:13px 18px;background:#00b1e7;color:#fff;font:900 14px Arial,sans-serif;box-shadow:0 12px 35px rgba(36,72,255,.32);cursor:pointer}
  .lmc-landing-panel{position:fixed;right:14px;bottom:76px;z-index:99991;width:min(390px,calc(100vw - 28px));height:min(610px,calc(100vh - 105px));display:none;flex-direction:column;overflow:hidden;background:#fff;border:1px solid #dde3f7;border-radius:24px;box-shadow:0 24px 70px rgba(16,24,40,.24);font-family:Arial,sans-serif}
  .lmc-landing-panel.open{display:flex}.lmc-landing-head{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;background:#00b1e7;color:#fff}.lmc-landing-title{font-size:16px;font-weight:900}.lmc-landing-close{width:34px;height:34px;border:0;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:22px;cursor:pointer}
  .lmc-landing-messages{flex:1;overflow:auto;padding:15px;background:#f7f8fc;display:flex;flex-direction:column;gap:10px}.lmc-landing-message{max-width:88%;padding:11px 13px;border-radius:16px;font-size:14px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}.lmc-landing-assistant{align-self:flex-start;background:#fff;color:#111;border:1px solid #e4e7ec}.lmc-landing-user{align-self:flex-end;background:#00b1e7;color:#fff}.lmc-landing-thinking{color:#667085;font-style:italic}
  .lmc-landing-form{display:flex;gap:8px;padding:12px;border-top:1px solid #e4e7ec;background:#fff}.lmc-landing-input{flex:1;min-width:0;border:1px solid #cdd5df;border-radius:14px;padding:11px 12px;font:14px Arial,sans-serif;outline:none}.lmc-landing-input:focus{border-color:#00b1e7;box-shadow:0 0 0 3px rgba(36,72,255,.10)}.lmc-landing-send{border:0;border-radius:14px;padding:0 15px;background:#00b1e7;color:#fff;font-weight:900;cursor:pointer}.lmc-landing-send:disabled{opacity:.55}
  @media(max-width:520px){.lmc-landing-panel{right:8px;bottom:70px;width:calc(100vw - 16px);height:calc(100vh - 88px)}.lmc-landing-launch{right:12px;bottom:12px}}
</style>
<button id="lmcLandingLaunch" class="lmc-landing-launch" type="button" aria-expanded="false">LinkMe contigo</button>
<section id="lmcLandingPanel" class="lmc-landing-panel" aria-label="LinkMe contigo">
  <div class="lmc-landing-head"><div class="lmc-landing-title">LinkMe contigo</div><button id="lmcLandingClose" class="lmc-landing-close" type="button" aria-label="Cerrar">×</button></div>
  <div id="lmcLandingMessages" class="lmc-landing-messages" aria-live="polite"></div>
  <form id="lmcLandingForm" class="lmc-landing-form"><input id="lmcLandingInput" class="lmc-landing-input" maxlength="900" autocomplete="off" placeholder="Escribe tu pregunta" aria-label="Escribe tu pregunta"><button id="lmcLandingSend" class="lmc-landing-send" type="submit">Enviar</button></form>
</section>
<script>
(function(){
  const endpoint={{ chat_api_url|tojson }};
  const launch=document.getElementById("lmcLandingLaunch"),panel=document.getElementById("lmcLandingPanel"),close=document.getElementById("lmcLandingClose"),form=document.getElementById("lmcLandingForm"),input=document.getElementById("lmcLandingInput"),send=document.getElementById("lmcLandingSend"),messages=document.getElementById("lmcLandingMessages");
  const history=[];let busy=false;
  function clientId(){const key="linkme_contigo_client_id";let value=localStorage.getItem(key);if(!value){value=crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);localStorage.setItem(key,value)}return value}
  function add(text,role,extra){const node=document.createElement("div");node.className="lmc-landing-message "+(role==="user"?"lmc-landing-user":"lmc-landing-assistant")+(extra?" "+extra:"");node.textContent=text;messages.appendChild(node);messages.scrollTop=messages.scrollHeight;return node}
  add("Hola, soy LinkMe contigo","assistant");
  launch.addEventListener("click",()=>{panel.classList.add("open");launch.setAttribute("aria-expanded","true");setTimeout(()=>input.focus(),80)});
  close.addEventListener("click",()=>{panel.classList.remove("open");launch.setAttribute("aria-expanded","false")});
  form.addEventListener("submit",async function(event){event.preventDefault();const text=input.value.trim();if(!text||busy)return;busy=true;send.disabled=true;input.disabled=true;add(text,"user");input.value="";const waiting=add("Estoy revisándolo…","assistant","lmc-landing-thinking");try{const response=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({context:"landing",client_id:clientId(),message:text,history:history.slice(-10)})});const data=await response.json();waiting.remove();const reply=data.reply||data.error||"No pude responder en este momento. Intenta nuevamente.";add(reply,"assistant");history.push({role:"user",content:text},{role:"assistant",content:reply});if(history.length>10)history.splice(0,history.length-10)}catch(error){waiting.remove();add("No pude responder en este momento. Intenta nuevamente.","assistant")}finally{busy=false;send.disabled=false;input.disabled=false;input.focus()}});
})();
</script>
