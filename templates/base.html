<!doctype html>
<!-- v1.068: sistema tipográfico y hover plateado gris-lila -->
<html lang="es" data-market="{{ market|default('usd') }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}linkme.life®{% endblock %}</title>
  <meta name="description" content="{% block description %}linkme.life® organiza tu identidad profesional en una tarjeta digital clara, viva y siempre actualizada.{% endblock %}">
  <link rel="icon" type="image/png" sizes="48x48" href="{{ url_for('static', filename='img/linkme-life-icon.png') }}?v={{ asset_version }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='img/linkme-life-icon.png') }}?v={{ asset_version }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ asset_version }}-1068">
</head>
<body>
<header class="lm-header">
  <nav class="lm-nav" aria-label="Navegación principal">
    <div class="lm-primary">
      <a class="lm-btn lm-login" href="{{ login_url }}" aria-label="Inicia sesión">Inicia sesión</a>
      <a class="lm-btn lm-create" href="{{ create_url }}" aria-label="Crear mi linkme.life®">
        <span class="lm-create-desktop">Crear mi linkme.life®</span>
        <span class="lm-create-mobile">Crear linkme.life®</span>
      </a>
    </div>
    <div class="lm-secondary">
      <a class="lm-chip" href="/#precio">Planes</a>
      <a class="lm-chip" href="/#preguntas">Dudas</a>
    </div>
  </nav>
</header>


<main>{% block content %}{% endblock %}</main>

<footer class="footer">
  <div class="footer-identity">
    <div class="footer-brand">linkme.life®</div>
    <p>Presentarte bien = crecer con presencia</p>
  </div>
  <div class="footer-legal">
    <h4>Legal</h4>
    <a href="/privacidad">Aviso de privacidad</a>
    <a href="/terminos">Términos</a>
  </div>
  <div class="footer-bottom">linkme.life® © 2026</div>
</footer>
<script src="{{ url_for('static', filename='js/main.js') }}?v={{ asset_version }}"></script>
</body>
</html>
