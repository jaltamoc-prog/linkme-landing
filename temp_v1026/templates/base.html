<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LinkMe{% endblock %}</title>
  <meta name="description" content="{% block description %}LinkMe organiza tu identidad profesional en una tarjeta digital clara, viva y siempre actualizada.{% endblock %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="site-header">
  <nav class="header-nav" aria-label="Navegación principal">
    <div class="header-primary-row">
      <a class="header-login-btn" href="{{ login_url }}" aria-label="Inicia sesión">
        <span class="header-icon" aria-hidden="true">◌</span>
        <span>Inicia sesión</span>
      </a>
      <a class="header-create-btn" href="{{ create_url }}" aria-label="Crear mi LinkMe">
        <span>Crear mi LinkMe</span>
      </a>
    </div>
    <div class="header-chip-row">
      <a class="header-link header-chip" href="/#como-funciona">
        <span class="header-chip-icon" aria-hidden="true">↯</span>
        <span>Cómo funciona</span>
      </a>
      <a class="header-link header-chip" href="/#caracteristicas">
        <span class="header-chip-icon" aria-hidden="true">✦</span>
        <span>Características</span>
      </a>
      <a class="header-link header-chip" href="/#precio">
        <span class="header-chip-icon" aria-hidden="true">⌁</span>
        <span>Precio</span>
      </a>
      <a class="header-link header-chip" href="/#preguntas">
        <span class="header-chip-icon" aria-hidden="true">?</span>
        <span>FAQ`s</span>
      </a>
    </div>
  </nav>
</header>


<main>{% block content %}{% endblock %}</main>

<footer class="footer">
  <div>
    <div class="footer-brand">LinkMe</div>
    <p>Presentarte bien, sin complicarte.</p>
  </div>
  <div class="footer-grid">
    <div><h4>Producto</h4><a href="/#como-funciona">Cómo funciona</a><a href="/#caracteristicas">Características</a><a href="/#precio">Precio</a></div>
    <div><h4>Legal</h4><a href="/privacidad">Aviso de privacidad</a><a href="/terminos">Términos</a><a href="/reembolso">Reembolso</a></div>
    <div><h4>Acción</h4><a href="{{ create_url }}">Crear mi LinkMe</a></div>
  </div>
  <div class="footer-bottom">linkme.style 2026</div>
</footer>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
