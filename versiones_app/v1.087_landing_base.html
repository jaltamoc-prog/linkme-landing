<!doctype html>
<!-- v1.086: identidad SEO inequívoca de CONVERTE para Google -->
<html lang="es" data-market="{{ market|default('usd') }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CONVERTE™{% endblock %}</title>
  <meta name="description" content="{% block description %}CONVERTE™ organiza tu identidad profesional en una tarjeta digital clara, viva y siempre actualizada.{% endblock %}">
  <meta name="application-name" content="CONVERTE">
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
  <link rel="canonical" href="https://converte.uno/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_MX">
  <meta property="og:site_name" content="CONVERTE">
  <meta property="og:title" content="CONVERTE | Tarjeta digital con QR para contactos y ventas">
  <meta property="og:description" content="CONVERTE es una tarjeta digital con QR para compartir contacto, WhatsApp, redes, ubicación y formas de pago desde un solo perfil actualizable.">
  <meta property="og:url" content="https://converte.uno/">
  <meta property="og:image" content="https://converte.uno/static/img/converte-uno-icon.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="CONVERTE | Tarjeta digital con QR">
  <meta name="twitter:description" content="Comparte tus datos y facilita que te contacten, te guarden y continúen la conversación.">
  <meta name="twitter:image" content="https://converte.uno/static/img/converte-uno-icon.png">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://converte.uno/#organization",
        "name": "CONVERTE",
        "alternateName": ["Converte.uno", "Converte.uno"],
        "url": "https://converte.uno/",
        "logo": "https://converte.uno/static/img/converte-uno-icon.png",
        "description": "CONVERTE ofrece una tarjeta digital con QR para organizar y compartir información profesional, contacto y formas de pago."
      },
      {
        "@type": "WebSite",
        "@id": "https://converte.uno/#website",
        "url": "https://converte.uno/",
        "name": "CONVERTE",
        "alternateName": ["Converte.uno", "Converte.uno"],
        "publisher": {"@id": "https://converte.uno/#organization"},
        "inLanguage": "es-MX"
      },
      {
        "@type": "SoftwareApplication",
        "@id": "https://converte.uno/#application",
        "name": "CONVERTE",
        "alternateName": "Converte.uno",
        "url": "https://converte.uno/",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "brand": {"@id": "https://converte.uno/#organization"},
        "description": "Tarjeta digital con QR para compartir contacto, WhatsApp, redes sociales, ubicación y formas de pago desde un perfil actualizable.",
        "featureList": [
          "Perfil público con QR",
          "Contacto descargable",
          "WhatsApp y redes sociales",
          "Ubicación y formas de pago",
          "Información actualizable sin cambiar el QR"
        ]
      }
    ]
  }
  </script>
  <link rel="icon" type="image/png" sizes="48x48" href="{{ url_for('static', filename='img/converte-uno-icon.png') }}?v={{ asset_version }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='img/converte-uno-icon.png') }}?v={{ asset_version }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ asset_version }}-1068">
</head>
<body>
<header class="lm-header">
  <nav class="lm-nav" aria-label="Navegación principal">
    <div class="lm-primary">
      <a class="lm-btn lm-login" href="{{ login_url }}" aria-label="Inicia sesión">Inicia sesión</a>
      <a class="lm-btn lm-create" href="{{ create_url }}" aria-label="Crear mi CONVERTE">
        <span class="lm-create-desktop">Crear mi CONVERTE</span>
        <span class="lm-create-mobile">Crear CONVERTE</span>
      </a>
    </div>
    <div class="lm-secondary">
      <a class="lm-wallet-mark" href="/#caracteristicas" aria-label="Compatible con Google Wallet">
        <img src="{{ url_for('static', filename='img/google-wallet-logo.svg') }}?v={{ asset_version }}" alt="Google Wallet">
      </a>
      <a class="lm-chip" href="/#precio">Planes</a>
      <a class="lm-chip" href="/#preguntas">Dudas</a>
    </div>
  </nav>
</header>


<main>{% block content %}{% endblock %}</main>

<footer class="footer">
  <div class="footer-identity">
    <div class="footer-brand">CONVERTE™</div>
    <p>Presentarte bien = crecer con presencia</p>
  </div>
  <div class="footer-legal">
    <h4>Legal</h4>
    <a href="/privacidad">Aviso de privacidad</a>
    <a href="/terminos">Términos</a>
  </div>
  <div class="footer-bottom">CONVERTE™ © 2026 · converte.uno</div>
</footer>
<script src="{{ url_for('static', filename='js/main.js') }}?v={{ asset_version }}"></script>
</body>
</html>
